<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SūSū&FūFū 吵架记录本 🐰</title>

<style>
  :root {
    --cream:      #fdf5e0;
    --cream-deep: #f8ead0;
    --butter:     #ffe8b8;
    --peach:      #ffd8b8;
    --pink:       #f8c8d8;
    --pink-deep:  #f0a8c0;
    --brown:      #8b6f5e;
    --brown-soft: #b89880;
    --text-light: #d8c0a8;
    --red:        #e07070;
    --green:      #7cbd7c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--cream);
    color: var(--brown);
    position: relative;
    overflow-x: hidden;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
  }

  /* 飘动的装饰元素 */
  .float-deco {
    position: fixed;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    font-size: 22px;
    opacity: 0.45;
    animation: floatAround 14s ease-in-out infinite;
  }

  .float-deco.d1 { top: 8%;  left: 4%;   animation-delay: 0s;   font-size: 20px; }
  .float-deco.d2 { top: 18%; right: 5%;  animation-delay: 2s;   font-size: 26px; }
  .float-deco.d3 { top: 35%; left: 2%;   animation-delay: 4s;   font-size: 18px; }
  .float-deco.d4 { top: 55%; right: 3%;  animation-delay: 1s;   font-size: 24px; }
  .float-deco.d5 { top: 75%; left: 5%;   animation-delay: 3s;   font-size: 22px; }
  .float-deco.d6 { top: 88%; right: 4%;  animation-delay: 5s;   font-size: 20px; }
  .float-deco.d7 { top: 45%; left: 1%;   animation-delay: 6s;   font-size: 28px; }
  .float-deco.d8 { top: 25%; left: 48%;  animation-delay: 7s;   font-size: 16px; }

  @keyframes floatAround {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(15px, -20px) rotate(15deg); }
    50%      { transform: translate(-10px, 15px) rotate(-10deg); }
    75%      { transform: translate(20px, 10px) rotate(8deg); }
  }

  /* 挂绳装饰 */
  .calendar-wrapper {
    position: relative;
    margin: 0 auto;
    max-width: 820px;
    padding: 40px 16px 32px;
    z-index: 1;
  }

  .hanging-cord {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 40px;
    background: #d4a08a;
    border-radius: 3px;
  }

  .hanging-cord::before {
    content: '';
    position: absolute;
    top: -10px;
    left: -5px;
    width: 16px;
    height: 16px;
    background: #d4a08a;
    border-radius: 50%;
  }

  .hanging-hole {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 18px;
    background: var(--cream);
    border: 3px solid #d4a08a;
    border-radius: 50%;
    z-index: 5;
  }

  .main-container {
    background: #fffaf0;
    border-radius: 24px;
    box-shadow: 0 12px 36px rgba(180, 140, 100, 0.15), 0 2px 8px rgba(180, 140, 100, 0.05);
    padding: 0;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    border: 2px solid var(--butter);
    position: relative;
    overflow: hidden;
  }

  /* 顶部头图区 */
  .header-banner {
    position: relative;
    background: var(--cream);
    border-radius: 24px 24px 0 0;
    overflow: hidden;
    width: 100%;
    height: 320px;
  }

  .header-banner img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 80%;
  }

  /* 底部渐变蒙层: 让兔兔底部和月亮边缘自然融入背景 */
  .header-banner::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: linear-gradient(to bottom, rgba(253, 245, 224, 0) 0%, var(--cream) 80%);
    pointer-events: none;
  }

  /* 艺术标题区 */
  .header-title {
    text-align: center;
    padding: 14px 20px 2px;
    position: relative;
  }

  .header-title h1 {
    font-size: 26px;
    font-weight: 800;
    color: var(--brown);
    letter-spacing: 1px;
    line-height: 1.6;
    position: relative;
    display: inline-block;
  }

  .header-title .name-susu {
    color: #e8986e;
    display: inline-block;
    text-shadow: 1px 1px 0 rgba(232,152,110,0.2);
    position: relative;
  }

  .header-title .name-fufu {
    color: #b088d0;
    display: inline-block;
    text-shadow: 1px 1px 0 rgba(176,136,208,0.2);
    position: relative;
  }

  .header-title .ampersand {
    display: inline-block;
    color: var(--brown-soft);
    margin: 0 2px;
    font-size: 22px;
    vertical-align: middle;
  }

  .header-title .subtitle-part {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--brown-soft);
    margin-top: 2px;
    letter-spacing: 2px;
    text-shadow: 0 1px 1px rgba(255,255,255,0.5);
  }

  .header-title .name-deco {
    position: absolute;
    font-size: 10px;
    pointer-events: none;
    user-select: none;
  }

  .header-title .name-deco.d1 { top: -6px;  left: -14px;  animation: twinkle 2s ease-in-out infinite; }
  .header-title .name-deco.d2 { top: -8px;  right: -16px; animation: twinkle 2.5s ease-in-out 0.3s infinite; }
  .header-title .name-deco.d3 { bottom: 14px; left: -10px;  animation: twinkle 3s ease-in-out 1s infinite; }
  .header-title .name-deco.d4 { bottom: 12px; right: -12px; animation: twinkle 2.8s ease-in-out 0.7s infinite; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%      { opacity: 1;   transform: scale(1.2); }
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.2); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }

  .subtitle {
    text-align: center;
    font-size: 12px;
    color: var(--brown-soft);
    padding: 8px 12px 0;
    letter-spacing: 0.5px;
  }

  .subtitle .star {
    color: var(--peach);
    margin: 0 4px;
  }

  /* 月份导航 */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 20px 8px;
  }

  .month-nav button {
    width: 32px;
    height: 32px;
    border: 2px solid var(--butter);
    background: white;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    color: var(--brown-soft);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .month-nav button:hover {
    background: var(--peach);
    color: white;
    border-color: var(--peach);
    transform: scale(1.05);
  }

  .month-nav .month-label {
    font-size: 18px;
    font-weight: 700;
    color: var(--brown);
    min-width: 130px;
    text-align: center;
    letter-spacing: 0.5px;
  }

  .month-nav .today-btn {
    width: auto;
    padding: 0 14px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: var(--pink);
    color: white;
    border-color: var(--pink);
  }

  .month-nav .today-btn:hover {
    background: var(--pink-deep);
    border-color: var(--pink-deep);
  }

  /* 图例 */
  .legend {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 4px 20px 8px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--brown-soft);
  }

  .legend-sticker {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    border: 1.5px dashed #d0c0b0;
    background: white;
  }

  /* 日历主体 */
  .calendar-body {
    padding: 0 20px 16px;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .weekday-header {
    text-align: center;
    padding: 6px 2px;
    font-size: 12px;
    font-weight: 700;
    color: var(--brown-soft);
    letter-spacing: 1px;
  }

  .weekday-header.weekend {
    color: var(--pink-deep);
  }

  /* 日期格子 */
  .day-cell {
    background: linear-gradient(135deg, #fffaee 0%, #fff3df 100%);
    border-radius: 12px;
    padding: 6px 4px;
    min-height: 78px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 2px rgba(180, 140, 100, 0.05);
  }

  .day-cell:hover {
    border-color: var(--peach);
    background: linear-gradient(135deg, #fff8ec 0%, #fff0d8 100%);
    transform: translateY(-2px) rotate(-0.5deg);
    box-shadow: 0 4px 12px rgba(255, 200, 150, 0.3);
  }

  .day-cell.empty {
    background: transparent;
    cursor: default;
    pointer-events: none;
    box-shadow: none;
  }

  .day-cell.empty:hover {
    border-color: transparent;
    transform: none;
    box-shadow: none;
  }

  .day-cell.today {
    border-color: var(--pink-deep) !important;
    box-shadow: 0 0 0 3px rgba(240, 168, 192, 0.2), 0 2px 8px rgba(240, 168, 192, 0.2);
  }

  .day-cell.has-record {
    background: linear-gradient(135deg, #fff5ec 0%, #ffe8d0 100%);
  }

  .day-number {
    font-size: 14px;
    font-weight: 700;
    color: var(--brown);
    margin-bottom: 2px;
  }

  .day-number.weekend {
    color: var(--pink-deep);
  }

  .day-reason {
    font-size: 10px;
    color: var(--brown-soft);
    line-height: 1.3;
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-all;
    margin-bottom: 4px;
  }

  .sticker-spot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px dashed #d0c0b0;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    background: white;
    transition: all 0.2s;
  }

  .sticker-spot.filled {
    border-style: solid;
    border-color: transparent;
    animation: pop 0.3s ease-out;
  }

  @keyframes pop {
    0% { transform: scale(0.5); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* 全部记录列表 */
  .record-list-body {
    display: none;
    padding: 18px 20px 16px;
  }
  .record-list-body.active {
    display: block;
  }
  .record-list-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 14px;
  }
  .record-list-empty .rabbit {
    font-size: 48px;
    display: block;
    margin-bottom: 12px;
  }
  .record-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #fff8ec 0%, #fff0d8 100%);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--butter);
  }
  .record-item .ri-date {
    font-size: 13px;
    font-weight: 700;
    color: var(--brown);
    white-space: nowrap;
    min-width: 110px;
  }
  .record-item .ri-sticker {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .record-item .ri-reason {
    flex: 1;
    font-size: 13px;
    color: var(--brown-soft);
    line-height: 1.4;
  }
  .record-item .ri-count {
    font-size: 11px;
    color: var(--text-light);
    font-weight: 600;
    padding: 2px 8px;
    background: rgba(255,255,255,0.6);
    border-radius: 8px;
    white-space: nowrap;
  }
  .list-print-btn {
    text-align: center;
    margin-top: 16px;
  }
  .list-print-btn .btn {
    flex: none;
    padding: 10px 22px;
    border-radius: 22px;
    font-size: 13px;
  }

  /* 截图模式: 不再隐藏任何元素, 完整截整个页面 */

  .calendar-body.hidden { display: none; }
  .weekday-headers-wrap.hidden { display: none; }
  .month-nav.hidden { display: none; }
  .legend.hidden { display: none; }

  /* 翻转切换按钮 */
  .btn-toggle {
    background: linear-gradient(135deg, #ffe8c8, #ffd8b8);
    color: var(--brown);
  }
  .btn-toggle:hover { background: linear-gradient(135deg, #ffd8a8, #ffc898); transform: translateY(-1px); }

  body.no-btns .list-print-btn,
  body.no-btns .footer-actions { display: none !important; }
  .sticker-love   { background: #ffe0f0; border-color: #e080b0; }

  /* 弹窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(139, 111, 94, 0.35);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: #fffaf0;
    border-radius: 20px;
    padding: 24px 22px 18px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 16px 40px rgba(139, 111, 94, 0.25);
    position: relative;
    animation: slideUp 0.25s ease-out;
    border: 2px solid var(--butter);
  }

  @keyframes slideUp {
    from { transform: translateY(20px) scale(0.95); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal .close-btn {
    position: absolute;
    top: 8px; right: 12px;
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    font-size: 16px;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 50%;
    transition: all 0.2s;
  }

  .modal .close-btn:hover {
    background: #f5ede0;
    color: var(--brown);
  }

  .modal h3 {
    text-align: center;
    color: var(--brown);
    font-size: 17px;
    margin-bottom: 6px;
  }

  .modal .date-display {
    text-align: center;
    font-size: 12px;
    color: var(--brown-soft);
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }

  .modal label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--brown);
    margin-bottom: 6px;
  }

  .modal textarea {
    width: 100%;
    height: 60px;
    border: 2px solid var(--cream-deep);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    color: var(--brown);
    background: #fffaf0;
  }

  .modal textarea:focus {
    border-color: var(--peach);
    background: white;
  }

  .sticker-picker {
    display: flex;
    gap: 8px;
    margin: 12px 0 6px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .sticker-option {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    transition: all 0.2s;
    background: white;
  }

  .sticker-option:hover { transform: scale(1.15); }

  .sticker-option.selected {
    border-color: var(--brown);
    box-shadow: 0 0 0 3px rgba(139, 111, 94, 0.18);
    transform: scale(1.1);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .btn {
    flex: 1;
    padding: 10px;
    border-radius: 14px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-save {
    background: var(--pink);
    color: white;
  }
  .btn-save:hover { background: var(--pink-deep); transform: translateY(-1px); }

  .btn-delete {
    background: #f0e8e0;
    color: var(--brown-soft);
  }
  .btn-delete:hover { background: #e8d8c8; }

  .btn-print {
    background: var(--peach);
    color: var(--brown);
  }
  .btn-print:hover { background: #ffcc99; transform: translateY(-1px); }

  /* 底部操作栏 */
  .footer-actions {
    display: flex;
    gap: 10px;
    padding: 0 20px 20px;
    justify-content: center;
  }

  .footer-actions .btn {
    flex: none;
    padding: 10px 22px;
    border-radius: 22px;
    font-size: 13px;
  }

  .footer-decor {
    text-align: center;
    padding-bottom: 18px;
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 0.5px;
  }

  /* 打印样式 */
  @media print {
    body { background: white; }
    .float-deco, .hanging-cord, .hanging-hole, .footer-actions, .modal-overlay,
    .btn:not(.btn-print), .month-nav button, .today-btn, .btn-toggle,
    .list-print-btn { display: none !important; }
    .calendar-body.hidden, .weekday-headers-wrap.hidden, .month-nav.hidden, .legend.hidden { display: block !important; }
    .record-list-body { display: block !important; }
    .record-list-body .record-list-empty { display: none !important; }
    .record-item { border: 1px solid #e8e0d0 !important; break-inside: avoid; }
    .calendar-wrapper { padding: 0; max-width: 100%; }
    .main-container { box-shadow: none; border: 1px solid #ccc; border-radius: 0; max-width: 100%; }
    .header-banner { border-radius: 0; }
    .day-cell { min-height: 50px; cursor: default; border: 1px solid #e8e0d0; break-inside: avoid; }
    .day-cell:hover { transform: none; box-shadow: none; border-color: #e8e0d0; }
    .day-cell.empty { background: white; }
    .sticker-spot { border: 2px dashed #ccc; }
    .sticker-spot.filled { border-style: dashed; border-color: #ccc; }
    @page { margin: 5mm; size: A4 portrait; }
  }
</style>
</head>
<body>

<!-- 飘动的装饰 -->
<div class="float-deco d1">🌸</div>
<div class="float-deco d2">⭐</div>
<div class="float-deco d3">💗</div>
<div class="float-deco d4">🎵</div>
<div class="float-deco d5">🌼</div>
<div class="float-deco d6">✨</div>
<div class="float-deco d7">🌙</div>
<div class="float-deco d8">💫</div>

<div class="calendar-wrapper">
  <div class="hanging-hole"></div>
  <div class="hanging-cord"></div>

  <div class="main-container">

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h3>📝 记录这一天</h3>
    <div class="date-display" id="modalDate"></div>

    <label>💬 生气原因</label>
    <textarea id="modalReason" placeholder="比如：我又忘记回她消息了…"></textarea>

    <label>🎀 她的心情贴纸</label>
    <div class="sticker-picker" id="stickerPicker"></div>

    <div class="modal-actions">
      <button class="btn btn-delete" id="btnDelete" onclick="deleteRecord()">🗑 删除</button>
      <button class="btn btn-save" onclick="saveRecord()">💾 保存</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal" style="text-align:center">
    <h3>⚠️ 确认操作</h3>
    <p id="confirmMsg" style="margin:12px 0;font-size:14px;color:var(--brown-soft)"></p>
    <div class="modal-actions">
      <button class="btn btn-delete" onclick="cancelConfirm()">取消</button>
      <button class="btn btn-save" id="confirmOkBtn">确认</button>
    </div>
  </div>
</div>

<script>
  const STICKERS = [
    { id: 'angry',  emoji: '😡', label: '很生气',  cls: 'sticker-angry' },
    { id: 'sad',    emoji: '😢', label: '有点难过', cls: 'sticker-sad' },
    { id: 'okay',   emoji: '😐', label: '就这样吧', cls: 'sticker-okay' },
    { id: 'happy',  emoji: '😊', label: '我不气了', cls: 'sticker-happy' },
    { id: 'love',   emoji: '🥰', label: '和好啦',   cls: 'sticker-love' },
  ];

  const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

  let currentYear, currentMonth;
  let editingDate = null;
  let selectedSticker = null;

  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();

  let isListView = false;

  /* ====== 视图切换 ====== */
  function toggleView() {
    isListView = !isListView;
    const btn = document.getElementById('btnToggle');
    const calendar = document.getElementById('calendarBody');
    const headers = document.getElementById('weekdayHeaders');
    const listBody = document.getElementById('recordListBody');
    const monthNav = document.querySelector('.month-nav');
    const legend = document.querySelector('.legend');

    if (isListView) {
      btn.textContent = '📅 返回日历';
      document.getElementById('btnPrintList').style.display = '';
      calendar.classList.add('hidden');
      if (headers) headers.classList.add('hidden');
      if (monthNav) monthNav.classList.add('hidden');
      if (legend) legend.classList.add('hidden');
      listBody.classList.add('active');
      renderRecordList();
    } else {
      btn.textContent = '📋 查看全部记录';
      document.getElementById('btnPrintList').style.display = 'none';
      calendar.classList.remove('hidden');
      if (headers) headers.classList.remove('hidden');
      if (monthNav) monthNav.classList.remove('hidden');
      if (legend) legend.classList.remove('hidden');
      listBody.classList.remove('active');
      renderCalendar();
    }
  }

  /* ====== 全部记录列表 ====== */
  function renderRecordList() {
    const allRecords = [];
    // 遍历云数据中所有记录
    for (var key in cloudData) {
      if (!cloudData.hasOwnProperty(key)) continue;
      var parts = key.split('_');
      var year = parseInt(parts[0]);
      var month = parseInt(parts[1]);
      if (isNaN(year) || isNaN(month)) continue;

      var monthRecords = cloudData[key];
      if (typeof monthRecords !== 'object') continue;
      for (var day in monthRecords) {
        if (!monthRecords.hasOwnProperty(day)) continue;
        var record = monthRecords[day];
        if (!record) continue;
        if (!record.reason && !record.stickerEmoji) continue;
        allRecords.push({
          date: new Date(year, month, parseInt(day)),
          reason: record.reason,
          stickerEmoji: record.stickerEmoji || '',
          stickerCls: record.stickerCls || '',
          count: record.count || 1
        });
      }
    }

    // 按日期从新到旧排序
    allRecords.sort((a, b) => b.date - a.date);

    const emptyEl = document.getElementById('recordListEmpty');
    const listEl = document.getElementById('recordList');

    if (allRecords.length === 0) {
      emptyEl.style.display = 'block';
      listEl.innerHTML = '';
      return;
    }

    emptyEl.style.display = 'none';
    listEl.innerHTML = allRecords.map((r, idx) => {
      const dateStr = `${r.date.getFullYear()}年${r.date.getMonth()+1}月${r.date.getDate()}日`;
      const weekDay = ['日','一','二','三','四','五','六'][r.date.getDay()];
      return `
        <div class="record-item">
          <div class="ri-sticker ${r.stickerCls}">${r.stickerEmoji}</div>
          <div class="ri-date">${dateStr} 周${weekDay}</div>
          <div class="ri-reason">${r.reason ? escapeHtml(r.reason) : '<span style="color:#d0c0b8">(只贴了心情贴纸)</span>'}</div>
          <div class="ri-count">第${allRecords.length - idx}次</div>
        </div>`;
    }).join('');
  }

    /* ====== 云同步 (jsonblob.com - 免费公共存储, 无需任何账号) ====== */
  var BLOB_ID = '019fa8e0-5e2c-75c8-b1cc-d6789a267505';
  var API_BASE = 'https://jsonblob.com/api/jsonBlob/' + BLOB_ID;
  var cloudData = {};
  var syncLocked = false;

  function syncPull(callback) {
    if (syncLocked) { if (callback) callback(); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_BASE + '?sort=createdOn&limit=1&t=' + Date.now());
    xhr.onload = function() {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (data && typeof data === 'object') {
            cloudData = data;
          }
        } catch(e) {}
      }
      if (callback) callback();
    };
    xhr.onerror = function() { if (callback) callback(); };
    xhr.send();
  }

  function syncPush(callback) {
    syncLocked = true;
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', API_BASE);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function() {
      syncLocked = false;
      if (callback) callback();
    };
    xhr.onerror = function() {
      syncLocked = false;
      if (callback) callback();
    };
    xhr.send(JSON.stringify(cloudData));
    setTimeout(function() { syncLocked = false; }, 15000);
  }

  function storageKey(year, month) {
    return year + '_' + month;
  }

  function loadRecords(year, month) {
    var key = storageKey(year, month);
    return (cloudData[key] && typeof cloudData[key] !== 'string')
      ? cloudData[key]
      : {};
  }

  function saveRecords(year, month, records) {
    var key = storageKey(year, month);
    cloudData[key] = records;
    renderCalendar();
    syncPush(null);
  }


function formatDate(year, month, day) {
    return `${year}年${month+1}月${day}日`;
  }

  function renderWeekdayHeaders() {
    const el = document.getElementById('weekdayHeaders');
    el.innerHTML = WEEKDAYS.map((w, i) => {
      const cls = (i === 0 || i === 6) ? 'weekday-header weekend' : 'weekday-header';
      return `<div class="${cls}">${w}</div>`;
    }).join('');
  }

  function renderCalendar() {
    document.getElementById('monthLabel').textContent = `${currentYear}年${currentMonth+1}月`;

    const records = loadRecords(currentYear, currentMonth);
    const today = new Date();

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();

    const grid = document.getElementById('calendarGrid');
    let html = '';

    for (let i = 0; i < firstDay; i++) {
      html += '<div class="day-cell empty"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dayOfWeek = (firstDay + d - 1) % 7;
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const isToday = (
        today.getFullYear() === currentYear &&
        today.getMonth() === currentMonth &&
        today.getDate() === d
      );

      const key = String(d);
      const record = records[key] || null;

      let cellClass = 'day-cell';
      if (isToday) cellClass += ' today';
      if (record) cellClass += ' has-record';

      const numClass = isWeekend ? 'day-number weekend' : 'day-number';
      const reasonText = record ? record.reason : '';
      const stickerCls = record ? record.stickerCls || '' : '';
      const stickerEmoji = record ? record.stickerEmoji || '' : '';

      html += `
        <div class="${cellClass}" onclick="openDay(${d})" title="点击记录这一天">
          <div class="${numClass}">${d}</div>
          <div class="day-reason">${escapeHtml(reasonText)}</div>
          <div class="sticker-spot ${stickerCls} ${stickerEmoji ? 'filled' : ''}">${stickerEmoji}</div>
        </div>`;
    }

    grid.innerHTML = html;
    updateFooterMessage();
  }

  /* ====== 底部鼓励语 ====== */
  var encourageMsgs = [
    '🐰 这个月没有吵架，太棒啦！继续甜甜蜜蜜～ 🎉',
    '🐰 才1次小别扭而已，我们超稳的！💪',
    '🐰 2次小火花，越磨越闪亮 ✨',
    '🐰 3次而已，吵完抱一抱更暖了 🫂',
    '🐰 4次小摩擦，爱情的调味剂刚刚好 🌶️',
    '🐰 5次斗嘴也挡不住我爱你呀 💕',
    '🐰 6次也是认真爱的证明，超在乎你 🤍',
    '🐰 7次啦！吵吵闹闹也是爱你的方式 🌈',
    '🐰 8次也有在好好相爱，对吧对吧～ 🫶',
    '🐰 9次了哎，但我们永远和好第一 💝',
    '🐰 10次！越吵越甜的秘诀就是我们吧 🍯',
  ];
  function getEncourageMsg(count) {
    if (count < encourageMsgs.length) return encourageMsgs[count];
    return '🐰 吵了' + count + '次啦，但每一回都是因为在乎你呀 💗';
  }
  function updateFooterMessage() {
    var records = loadRecords(currentYear, currentMonth);
    var count = Object.keys(records).filter(function(k) {
      return records[k] && (records[k].reason || records[k].stickerEmoji);
    }).length;
    document.getElementById('footerMsg').textContent = getEncourageMsg(count);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function openDay(day) {
    editingDate = day;

    const records = loadRecords(currentYear, currentMonth);
    const record = records[String(day)] || null;

    document.getElementById('modalDate').textContent = formatDate(currentYear, currentMonth, day);
    document.getElementById('modalReason').value = record ? record.reason : '';

    selectedSticker = record ? record.stickerId : null;

    const btnDel = document.getElementById('btnDelete');
    btnDel.style.display = record ? '' : 'none';

    renderStickerPicker();
    document.getElementById('modalOverlay').classList.add('active');
    document.getElementById('modalReason').focus();
  }

  function renderStickerPicker() {
    const picker = document.getElementById('stickerPicker');
    picker.innerHTML = STICKERS.map(s => {
      const sel = selectedSticker === s.id ? ' selected' : '';
      return `<div class="sticker-option${sel}" onclick="pickSticker('${s.id}')" title="${s.label}">${s.emoji}</div>`;
    }).join('');
  }

  function pickSticker(id) {
    selectedSticker = id;
    renderStickerPicker();
  }

  function saveRecord() {
    if (editingDate === null) return;

    const reason = document.getElementById('modalReason').value.trim();
    const records = loadRecords(currentYear, currentMonth);

    if (!reason && !selectedSticker) {
      delete records[String(editingDate)];
    } else {
      const sticker = STICKERS.find(s => s.id === selectedSticker);
      records[String(editingDate)] = {
        reason: reason,
        stickerId: selectedSticker,
        stickerEmoji: sticker ? sticker.emoji : '',
        stickerCls: sticker ? sticker.cls : '',
      };
    }

    saveRecords(currentYear, currentMonth, records);
    closeModal();
    renderCalendar();
  }

  function deleteRecord() {
    if (editingDate === null) return;
    const records = loadRecords(currentYear, currentMonth);
    delete records[String(editingDate)];
    saveRecords(currentYear, currentMonth, records);
    closeModal();
    renderCalendar();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    editingDate = null;
    selectedSticker = null;
  }

  function prevMonth() {
    if (currentMonth === 0) { currentMonth = 11; currentYear--; }
    else { currentMonth--; }
    renderCalendar();
  }

  function nextMonth() {
    if (currentMonth === 11) { currentMonth = 0; currentYear++; }
    else { currentMonth++; }
    renderCalendar();
  }

  function goToday() {
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();
    renderCalendar();
  }

  function clearMonth() {
    var key = storageKey(currentYear, currentMonth);
    if (!cloudData[key]) {
      showAlert(currentYear + '年' + (currentMonth+1) + '月没有记录');
      return;
    }
    showConfirm('确定要清空' + currentYear + '年' + (currentMonth+1) + '月的所有记录吗？', function() {
      delete cloudData[key];
      syncPush(function() { renderCalendar(); });
      closeAlert();
    });
  }

  /* ====== 自定义确认弹窗 ====== */
  let confirmCallback = null;

  function showConfirm(msg, cb) {
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOkBtn').onclick = cb;
    document.getElementById('confirmOkBtn').textContent = '确认';
    confirmCallback = cb;
    document.getElementById('confirmOverlay').classList.add('active');
  }
  function cancelConfirm() {
    confirmCallback = null;
    document.getElementById('confirmOverlay').classList.remove('active');
  }
  function showAlert(msg) {
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOkBtn').onclick = function() {
      document.getElementById('confirmOverlay').classList.remove('active');
    };
    document.getElementById('confirmOkBtn').textContent = '知道了';
    document.getElementById('confirmOverlay').classList.add('active');
  }
  function closeAlert() {
    cancelConfirm();
  }

  function printCalendar() {
    // 懒加载 html2canvas
    if (typeof html2canvas === 'undefined') {
      var s = document.createElement('script');
      s.src = 'html2canvas.min.js';
      s.onload = function() { setTimeout(printCalendar, 200); };
      document.head.appendChild(s);
      return;
    }

    document.body.classList.add('no-btns');
    var wrapper = document.querySelector('.calendar-wrapper');
    var banner = document.querySelector('.header-banner');
    var img = banner ? banner.querySelector('img') : null;
    var origStyle = '';

    if (img && img.naturalWidth > 0) {
      origStyle = img.style.cssText;
      var bw = banner.offsetWidth, bh = banner.offsetHeight;
      var iw = img.naturalWidth, ih = img.naturalHeight;
      var scale = Math.max(bw/iw, bh/ih);
      var sw = Math.round(iw * scale), sh = Math.round(ih * scale);
      img.style.cssText = 'position:absolute;top:'+(Math.round((bh-sh)*0.8))+'px;left:'+(Math.round((bw-sw)/2))+'px;width:'+sw+'px;height:'+sh+'px;object-fit:fill;z-index:0;';
    }

    setTimeout(function() {
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#fdf5e0', useCORS: true, allowTaint: true
      }).then(function(canvas) {
        document.body.classList.remove('no-btns');
        if (img) img.style.cssText = origStyle;
        canvas.toBlob(function(blob) {
          var a = document.createElement('a');
          a.download = '吵架记录_' + new Date().toISOString().slice(0,10) + '.png';
          a.href = URL.createObjectURL(blob);
          a.click();
        });
      }).catch(function() {
        document.body.classList.remove('no-btns');
        if (img) img.style.cssText = origStyle;
      });
    }, 50);
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.getElementById('confirmOverlay').addEventListener('click', function(e) {
    if (e.target === this) cancelConfirm();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('confirmOverlay').classList.contains('active')) {
        cancelConfirm();
      } else {
        closeModal();
      }
    }
  });

  // 初始化: 先拉云端数据, 再渲染
  renderWeekdayHeaders();
  syncPull(function() { renderCalendar(); });

  // 每 8 秒检查对方有没有更新
  setInterval(function() {
    syncPull(function() { renderCalendar(); });
  }, 8000);
</script>
</body>
</html>
